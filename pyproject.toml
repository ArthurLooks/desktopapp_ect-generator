[project]
name = "gerador-pdf"
version = "0.2.0"
description = "Gerador de PDF a partir de imagens — galeria com prévia, ordenação, capa personalizável e exportação otimizada em PDF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter==5.2.2",
    "pillow==10.4.0",
    "reportlab==4.2.5",
    "tkinterdnd2==0.4.2",
]

[dependency-groups]
dev = [
    "pyinstaller==6.10.0",
]
